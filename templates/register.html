{% extends "base.html" %}
{% block title %}Registrace — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Registrace</h1>
  <p class="lead">Založ si účet. Odpovědi i značky „těžká" budou jen tvoje,
  nikdo jiný je nevidí.</p>

  {% if error %}<p class="err">{{ error }}</p>{% endif %}

  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>E-mail
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>Heslo <span class="muted">(aspoň 8 znaků)</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>Heslo znovu
      <input type="password" name="password2" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Vytvořit účet</button>
  </form>

  <p class="muted">Už máš účet? <a href="/login">Přihlas se</a>.</p>
</div>
{% endblock %}
