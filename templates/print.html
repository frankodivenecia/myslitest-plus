<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ doc_title }} — {{ APP_NAME }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="printbody">
  <div class="noprint printbar">
    <button onclick="window.print()">Vytisknout / uložit PDF</button>
    <a href="javascript:history.back()">Zpět</a>
  </div>

  <article class="printdoc">
    <h1 class="printtitle">{{ doc_title }}</h1>
    {% if not groups %}
    <p class="muted">Zatím tu nemáš žádnou vlastní odpověď k tisku.</p>
    {% else %}
    {% for g in groups %}
    <section class="printgroup">
      <h2>{{ g.heading }}</h2>
      {% for it in g.rows %}
      <div class="pq">
        <p class="pq-q"><span class="pq-code">{{ it.code }} · {{ it.qid }}</span> {{ it.text }}</p>
        <div class="pq-a">{{ it.answer_html|safe }}</div>
      </div>
      {% endfor %}
    </section>
    {% endfor %}
    {% endif %}
  </article>
</body>
</html>
