<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ doc_title }} — {{ APP_NAME }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="printbody">
  <div class="noprint printbar">
    <button onclick="window.print()">Vytisknout / uložit PDF</button>
    <a href="javascript:history.back()">Zpět</a>
  </div>

  <article class="printdoc">
    <h1 class="printtitle">{{ doc_title }}</h1>

    {% for g in groups %}
    <section class="printgroup">
      <h2>{{ g.heading }}</h2>
      {% for it in g.rows %}
      <div class="pq">
        <p class="pq-q"><span class="pq-code">{{ it.code }} · {{ it.qid }}</span> {{ it.text }}</p>
        {% if it.answer_html %}
        <div class="pq-a{% if it.is_master %} is-master{% endif %}">
          {% if it.is_master %}<span class="pq-tag">vzor</span>{% endif %}
          {{ it.answer_html|safe }}
        </div>
        {% else %}
        <div class="pq-a pq-empty">— bez odpovědi —</div>
        {% endif %}
      </div>
      {% endfor %}
    </section>
    {% endfor %}
  </article>
</body>
</html>
